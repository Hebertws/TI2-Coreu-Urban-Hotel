<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Montclair | Luxo urbano em São Paulo</title>
  <meta name="description" content="Hotel Montclair — hotel urbano de alto padrão na Vila Olímpia, São Paulo. Arquitetura contemporânea, natureza integrada e hospitalidade sofisticada.">

  <!-- Google Fonts: Playfair Display (títulos) + Inter (textos e interface) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS (via CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS próprio do Hotel Montclair (identidade visual personalizada) -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ==========================================================
       HEADER / NAVBAR
       (Etapa 5 — navbar Bootstrap personalizada, com item Reservar
       e menu colapsável no mobile)
       ========================================================== -->
  <header id="header">
    <!-- navbar entra aqui -->
  </header>

  <main>

    <!-- ==========================================================
         HERO + FORMULÁRIO DE BUSCA
         (Etapas 6 e 7)
         ========================================================== -->
    <section id="inicio">
      <!-- hero (imagem, título MONTCLAIR, texto, botões) entra aqui -->
      <!-- formulário de busca (check-in, check-out, hóspedes, quartos) entra aqui -->
    </section>

    <!-- ==========================================================
         SOBRE O HOTEL
         (Etapa 8)
         ========================================================== -->
    <section id="hotel">
      <!-- título "Onde a cidade encontra a tranquilidade." + imagem/texto entram aqui -->
    </section>

    <!-- ==========================================================
         QUARTOS
         (Etapa 9)
         ========================================================== -->
    <section id="quartos">
      <!-- cards Standard / Deluxe / Executive / Suite entram aqui -->
    </section>

    <!-- ==========================================================
         EXPERIÊNCIAS
         (Etapa 10)
         ========================================================== -->
    <section id="experiencias">
      <!-- Piscina Rooftop, Spa, Academia, Lounge, Coworking entram aqui -->
    </section>

    <!-- ==========================================================
         PISCINA ROOFTOP (destaque)
         (Etapa 11)
         ========================================================== -->
    <section id="piscina">
      <!-- seção de destaque "São Paulo aos seus pés." entra aqui -->
    </section>

    <!-- ==========================================================
         RESTAURANTE
         (Etapa 12)
         ========================================================== -->
    <section id="restaurante">
      <!-- L'Atelier Montclair entra aqui -->
    </section>

    <!-- ==========================================================
         LOCALIZAÇÃO
         (Etapa 13)
         ========================================================== -->
    <section id="contato">
      <!-- endereço, telefone, e-mail e mapa fictício entram aqui -->
    </section>

    <!-- ==========================================================
         AVALIAÇÕES
         (Etapa 14)
         ========================================================== -->
    <section id="avaliacoes">
      <!-- carrossel Bootstrap com avaliações fictícias entra aqui -->
    </section>

    <!-- ==========================================================
         CTA FINAL
         (Etapa 15)
         ========================================================== -->
    <section id="cta">
      <!-- "Sua próxima estadia começa aqui." + botão Reservar agora entram aqui -->
    </section>

  </main>

  <!-- ==========================================================
       FOOTER
       (Etapa 16)
       ========================================================== -->
  <footer id="footer">
    <!-- links, contato e redes sociais entram aqui -->
  </footer>

  <!-- Bootstrap JS Bundle (inclui Popper — necessário para navbar, modais e carrossel) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JS próprio da homepage -->
  <script src="js/script.js"></script>
</body>
</html>
